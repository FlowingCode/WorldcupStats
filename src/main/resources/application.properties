cron.match.refresh=0 */1 * * * *

# Caching (Caffeine; 120s TTL mirrors the previous ehcache config)
spring.cache.type=caffeine
spring.cache.cache-names=matches,matchesByCountry,groups,matchDetail,futureMatches,teams
spring.cache.caffeine.spec=expireAfterWrite=120s,maximumSize=200

vaadin.frontend.hotdeploy=true
